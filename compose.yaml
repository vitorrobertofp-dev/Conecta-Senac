version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: conectasenac-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: verYs3cret
      POSTGRES_DB: conectasenac
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: